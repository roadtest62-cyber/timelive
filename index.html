<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý thời gian livestream</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <h1>QUẢN LÝ THỜI GIAN LIVESTREAM</h1>
      </header>

      <section class="controls card">
        <div class="loading-overlay" id="loadingOverlay">
          <div class="loading-spinner"></div>
          <span>Đang tải...</span>
        </div>

        <div class="control-row">
          <div class="month-picker">
            <select id="monthSelect"></select>
            <select id="yearSelect"></select>
          </div>
          <div class="top-actions">
            <button id="exportCsvBtn" type="button" class="btn-ghost">CSV</button>
            <button id="exportJsonBtn" type="button" class="btn-ghost">Sao lưu</button>
            <button id="importJsonBtn" type="button" class="btn-ghost">Nhập</button>
            <div class="divider"></div>
            <button id="clearMonthBtn" type="button" class="btn-ghost btn-danger-text">Xóa tháng</button>
            <button id="clearAllBtn" type="button" class="btn-ghost btn-danger-text">Xóa hết</button>
          </div>
        </div>

        <input id="importFileInput" type="file" accept="application/json" hidden />
      </section>

      <section class="table-card card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th class="col-stt">#</th>
                <th class="col-date">Ngày</th>
                <th class="col-sessions">Ca livestream</th>
                <th class="col-total">Tổng</th>
              </tr>
            </thead>
            <tbody id="daysTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="summary card" id="summarySection"></section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
