<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý thời gian livestream</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Tiêu đề -->
    <header class="header">
      <h1>QUẢN LÝ THỜI GIAN LIVESTREAM</h1>
      <div class="save-status" id="saveStatus"></div>
    </header>

    <!-- Khu vực điều khiển -->
    <section class="controls card">
      <div class="controls-row">
        <div class="controls-left">
          <label class="field">
            <span>Tháng</span>
            <select id="monthSelect"></select>
          </label>
          <label class="field">
            <span>Năm</span>
            <select id="yearSelect"></select>
          </label>
          <button id="todayBtn" type="button" class="btn-accent">Tháng hiện tại</button>
        </div>
        <div class="controls-right">
          <button id="saveBtn" type="button" class="btn-accent">Lưu dữ liệu</button>
          <button id="exportCsvBtn" type="button">Xuất CSV</button>
          <button id="backupJsonBtn" type="button">Sao lưu JSON</button>
          <button id="restoreJsonBtn" type="button">Khôi phục JSON</button>
          <button id="clearMonthBtn" type="button" class="btn-danger">Xóa dữ liệu tháng</button>
        </div>
      </div>
      <input id="restoreFileInput" type="file" accept="application/json" hidden />
    </section>

    <!-- Bảng dữ liệu -->
    <section class="table-card card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="c-stt">STT</th>
              <th class="c-date">Ngày</th>
              <th class="c-sessions">Các ca livestream</th>
              <th class="c-count">Tổng số ca</th>
              <th class="c-minutes">Tổng số phút</th>
              <th class="c-total">Tổng thời gian</th>
              <th class="c-actions">Thao tác</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Tổng kết tháng -->
    <section class="summary card" id="summary"></section>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
